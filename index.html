<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1 id="status">Player 1's Turn (O)</h1>
        
        <div class="grid"> 
            <button id="btn11" class="grid-item"></button>
            <button id="btn12" class="grid-item"></button>
            <button id="btn13" class="grid-item"></button>

            <button id="btn21" class="grid-item"></button>
            <button id="btn22" class="grid-item"></button>
            <button id="btn23" class="grid-item"></button>

            <button id="btn31" class="grid-item"></button>
            <button id="btn32" class="grid-item"></button>
            <button id="btn33" class="grid-item"></button>
        </div>

        <button id="reset-btn">Reset Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
